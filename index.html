function resumeIOSAudioOnGesture() {
    if (!pendingIOSResume) return;
    pendingIOSResume = false;
    if (window.createjs && createjs.WebAudioPlugin && createjs.WebAudioPlugin.context) {
        var ctx = createjs.WebAudioPlugin.context;
        if (ctx.state !== "running") {
            ctx.resume();
        }
    }
    if (!bgMusicInstance) {
        bgMusicInstance = createjs.Sound.play("bgMusic", { loop: -1, volume: 0.02 });
    }
    bgMusicInstance.paused = !musicEnabled;
}
document.addEventListener("touchend", resumeIOSAudioOnGesture, true);
document.addEventListener("click", resumeIOSAudioOnGesture, true);
document.addEventListener("visibilitychange", function () {
    if (document.hidden) {
        createjs.Sound.muted = true;    // 👈 اكتم كل الأصوات
    } else {
        createjs.Sound.muted = false;   // 👈 رجّع الصوت
    }
    // منطق الـ bgMusic الموجود عندك زي ما هو
    if (!bgMusicInstance) return;
    if (document.hidden) {
        bgMusicInstance.paused = true;
    } else {
        if (isIOS && /iPhone|iPod/.test(navigator.userAgent)) {
            bgMusicInstance.paused = true;
            pendingIOSResume = true;
        } else if (isIOS) {
            bgMusicInstance.paused = false;
            createjs.Sound.resume();
            bgMusicInstance.paused = true;
            bgMusicInstance.paused = false;
        } else {
            bgMusicInstance.paused = !musicEnabled;
        }
    }
});
window.addEventListener("blur", function () {

// =================================================
// LOAD ACTIVITY LOADER - LOGO ONLY
// =================================================
function loadLogoActivityLoader() {
    if (logoApiStarted) return;
    logoApiStarted = true;
    var script = document.createElement("script");
    script.type = "module";
    script.src = logoScriptsPath + "activity-loader.js";
    script.onload = function () {
        console.log(
            "✅ Activity Loader loaded for logo:",
            script.src
        );
        loadLogoFromAPI();
    };
    script.onerror = function (error) {
        console.warn(
            "⚠️ Activity Loader failed to load. Continuing without logo.",
            error
        );
        logoApiFinished = true;
    };
    document.head.appendChild(script);
}
// =================================================
// GET LOGO FROM ACTIVITY API
// =================================================
async function loadLogoFromAPI() {
    if (!logoActivityID) {
        logoApiFinished = true;
        return;
    }
    if (typeof getActivityData !== "function") {
        console.warn(
            "⚠️ getActivityData is not available. Continuing without logo."
        );
        logoApiFinished = true;
        return;
    }
    try {
        console.log("🔄 Loading activity data for logo...");
        var data = await getActivityData(
            logoActivityID,
            logoUserToken
        );
        console.log("📦 Activity API response:", data);
        if (!data || !data.status) {
            console.warn(
                "⚠️ Activity API returned no valid data. Continuing without logo."
            );
            logoApiFinished = true;
            return;
        }
        // We ONLY care about the logo.
        logoURL = data.logo || null;
        logoApiFinished = true;
        if (!logoURL) {
            console.warn(
                "⚠️ Activity has no logo URL. Continuing without logo."
            );
            return;
        }
        console.log("🖼️ Logo URL received:", logoURL);
        waitForLogoStageAndLoad();
    } catch (error) {
        console.warn(
            "⚠️ Logo API request failed. Activity will continue normally.",
            error
        );
        logoApiFinished = true;
    }
}

    if (!logoURL) return;

        exportRoot.logo_mc

}

function loadLogoIntoMC(mc, url) {
    if (!mc || !url) {
        return;
    }
    var container = mc.getChildAt(0);
    if (!container) {
        container = mc;
    }
    var bounds = container.nominalBounds || {
        width: 100,
        height: 120
    };
    // Remove existing logo content
    if (container.removeAllChildren) {
        container.removeAllChildren();
    } else {
        mc.removeAllChildren();
        container = mc;
    }
    var img = new Image();
    img.onload = function () {
        try {
            var bitmap = new createjs.Bitmap(img);
            bitmap.scaleX =
                bounds.width / img.width;
            bitmap.scaleY =
                bounds.height / img.height;
            bitmap.x = 0;
            bitmap.y = 0;
            container.addChild(bitmap);
            stage.update();
            console.log(
                "✅ Logo loaded successfully."
            );
        } catch (error) {
            console.warn(
                "⚠️ Failed to render logo.",
                error
            );
        }
    };
    img.onerror = function () {
        console.warn(
            "⚠️ Logo image failed to load:",
            url
        );
        // IMPORTANT:
        // Do not stop or affect the activity.
    };
    img.src = url;
}

var currentSuccessVoiceInstance = null;
function playRandomSuccessVoice(questionNumber, onComplete) {
  if (typeof questionNumber === "undefined") {
    questionNumber = window.currentQuestionNumber;
  }
  var voices = successVoicesMap[questionNumber];
  if (!voices || !voices.length) {
    console.warn("🔇 No success voices for question:", questionNumber);
    if (onComplete) onComplete();
    return;
  }
  var readyVoices = voices.filter(function (id) {
    return createjs.Sound.loadComplete(id);
  });
  // كله جاهز؟ شغّل واحد عشوائي على طول
  if (readyVoices.length) {
    playSuccessVoiceNow(
      readyVoices[Math.floor(Math.random() * readyVoices.length)],
      questionNumber,
      onComplete
    );
    return;
  }
  // مفيش حاجة جاهزة: استنى أول صوت من القايمة يخلص تحميل
  console.warn("⏳ Voices still loading for question:", questionNumber, "- waiting...");
  var played = false;
  function onVoiceLoaded(e) {
    if (played) return;
    if (voices.indexOf(e.id) === -1) return;
    played = true;
    createjs.Sound.off("fileload", onVoiceLoaded);
    playSuccessVoiceNow(e.id, questionNumber, onComplete);
  }
  createjs.Sound.on("fileload", onVoiceLoaded);
  // مهلة قصوى: لو عدت ثانيتين ومفيش حاجة اتحملت، بلاش الصوت خالص
  setTimeout(function () {
    if (!played) {
      played = true;
      createjs.Sound.off("fileload", onVoiceLoaded);
      console.warn("🔇 Gave up waiting for voices, question:", questionNumber);
      if (onComplete) onComplete();
    }
  }, 2000);
}
function playSuccessVoiceNow(soundId, questionNumber, onComplete) {
  if (currentErrorVoiceInstance) {          // 👈
    currentErrorVoiceInstance.stop();
    currentErrorVoiceInstance = null;
  }
  if (currentSuccessVoiceInstance) {
    currentSuccessVoiceInstance.stop();
    currentSuccessVoiceInstance = null;
  }
  if (window.currentVoiceInstance) {          // 👇 اقطع صوت العنوان/الأرقام لو شغال
    window.currentVoiceInstance.stop();
    window.currentVoiceInstance = null;
  }
  currentSuccessVoiceInstance = createjs.Sound.play(soundId);
  window.currentSuccessVoiceInstance = currentSuccessVoiceInstance;
  if (onComplete && currentSuccessVoiceInstance) {
    currentSuccessVoiceInstance.on("complete", function handler() {
      currentSuccessVoiceInstance && currentSuccessVoiceInstance.off && currentSuccessVoiceInstance.off("complete", handler);
      onComplete();
    });
  }
  console.log("🎉 Playing success voice:", soundId, "for question", questionNumber);
}

    playErrorVoiceNow(pool[Math.floor(Math.random() * pool.length)]);

  console.warn("⏳ Error voices still loading - waiting...");
  var played = false;
  function onVoiceLoaded(e) {
    if (played) return;
    if (errorVoices.indexOf(e.id) === -1) return;
    played = true;
    createjs.Sound.off("fileload", onVoiceLoaded);
    playErrorVoiceNow(e.id);
  }
  createjs.Sound.on("fileload", onVoiceLoaded);
  setTimeout(function () {
    if (!played) {
      played = true;
      createjs.Sound.off("fileload", onVoiceLoaded);
      console.warn("🔇 Gave up waiting for error voices");
    }
  }, 2000);
}

window.optionSoundsMap = {};
window.currentOptionSoundInstance = null;
function registerOptionSounds(data) {
  if (!data || !data.elements) return;
  window.optionSoundsMap = {};
  data.elements.forEach(function (element) {
    if (!element.options) return;
    element.options.forEach(function (option, optionIndex) {
      if (!option.audio) return;
      var soundId =
        "option_" +
        element.id +
        "_" +
        (optionIndex + 1);
      var soundPath = templateDataURL
        ? templateDataURL + option.audio
        : option.audio;
      try {
        var registerResult = createjs.Sound.registerSound(
          soundPath,
          soundId
        );
        // لو CreateJS رفض الملف مباشرة
        if (!registerResult) {
          console.warn(
            "⚠️ Sound skipped:",
            soundId,
            soundPath
          );
          return;
        }

function shake(target, intensity) {
	if (!target) {
		return;
	}
	intensity = intensity || 8;
	// خزّن المكان الأصلي أول مرة بس
	if (typeof target._shakeHomeX === "undefined") {
		target._shakeHomeX = target.x;
	}
	var originalX = target._shakeHomeX;
	createjs.Tween.removeTweens(target);
	target.x = originalX;   // رجّعه لمكانه قبل ما تبدأ
	createjs.Tween.get(target)
		.to({ x: originalX - intensity }, 45)
		.to({ x: originalX + intensity }, 90)
		.to({ x: originalX - Math.round(intensity * 0.6) }, 70)
		.to({ x: originalX + Math.round(intensity * 0.6) }, 70)
		.to({ x: originalX }, 45);
